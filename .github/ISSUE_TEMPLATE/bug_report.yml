name: 问题反馈
description: 报告功能错误或闪退；请勿包含个人记录。
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "此 Issue 对所有人公开。请勿上传个人记录、备份文件、含隐私的截图、账号信息或设备标识。"
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 例如 0.5.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 用不含个人数据的示例描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
